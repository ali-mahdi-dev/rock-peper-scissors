<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style/index.css">
  <title>Rock-Peper-Scisser</title>
</head>
<body>
	<h1 class="title">Rock-Peper-Scisser</h1>
	
	<div class="selection-preview">
		<span class="user-select"> You </span>
		<span class="vs"> VS </span>
		<span class="computer-select"> Computer </span>
	</div>
	
	<div class="result"> ~Result~ </div>
	<div class="results-history">
		<span class="wins"> Wins: 0 </span>
		<span class="loses"> Loses: 0 </span>
	</div>

	<span class="selection-hint">Tap To Select: </span>
	<div class="selection-box">
		<button class="btn paper" value="0">Paper ✋</button>
		<button class="btn scissors" value="1">Scissors ✌️</button>
		<button class="btn rock" value="2">Rock ✊</button>
	</div>
	
<script src="script/index.js"></script>
</body>
</html>
